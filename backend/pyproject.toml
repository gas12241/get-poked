[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # flake8-django
]

[tool.ruff.lint.isort]
known-first-party = ["core", "config"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "manage.py", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
fail_under = 80
